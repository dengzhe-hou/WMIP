name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'releases/2026-10/analysis/paper/figures/fig_overview.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare static website
        run: |
          mkdir -p "$RUNNER_TEMP/wmip-site/assets"
          cp -R site/. "$RUNNER_TEMP/wmip-site/"
          cp releases/2026-10/analysis/paper/figures/fig_overview.svg "$RUNNER_TEMP/wmip-site/assets/fig_overview.svg"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/wmip-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
