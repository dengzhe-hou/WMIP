name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/site/**'
      - 'tests/reuse/**'
      - 'releases/2026-10/code/generator/build_item_bank.py'
      - 'releases/2026-10/code/runner/run_wmf_am_bank.py'
      - 'releases/2026-10/analysis/score_bank.py'
      - 'releases/2026-10/analysis/score_ext.py'
      - 'releases/2026-10/wmip.py'
      - 'releases/2026-10/examples/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify browser generators against Python
        run: |
          python3 tests/site/check_generator.py
          python3 tests/site/check_batch.py
          python3 tests/site/check_browser_evaluation.py
          python3 -m unittest discover -s tests/reuse -v
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare static website
        run: |
          mkdir -p "$RUNNER_TEMP/wmip-site"
          cp -R site/. "$RUNNER_TEMP/wmip-site/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/wmip-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
